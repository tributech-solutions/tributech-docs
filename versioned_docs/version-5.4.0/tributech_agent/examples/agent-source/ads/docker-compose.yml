version: '3.6'

services:
  # Prepares the bind-mounted folders for the Tributech Agent, which runs as the
  # non-root user 1654 and ships without the tooling to change ownership itself.
  # This replaces a manual `sudo chown -R 1654:1654 enrollment volumes` on the host.
  init-permissions:
    image: busybox:1.36
    user: "0:0"
    command: sh -c "chown -R 1654:1654 /mnt/enrollment /mnt/volumes"
    volumes:
      - ./enrollment:/mnt/enrollment
      - ./volumes:/mnt/volumes

  source-ads:
    restart: unless-stopped
    image: ${DOCKER_REGISTRY-tributech.azurecr.io/}tributech-source-ads:${SOURCE_TAG:-5.2.0}
    depends_on:
      - mosquitto-server
      - tributech-agent
    environment:
      - MqttOptions__MQTTHost=mosquitto-server
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__ADSRouter=Error
    networks:
      ads-net:
        ipv4_address: 172.24.1.5
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "5"

  tributech-agent:
    image: ${DOCKER_REGISTRY-tributech.azurecr.io/}tributech-agent:${AGENT_TAG:-5.5.0}
    depends_on:
      mosquitto-server:
        condition: service_started
      init-permissions:
        condition: service_completed_successfully
    environment:
      - Logging__LogLevel__Default=Information
      - MqttOptions__MQTTHost=mosquitto-server
      - EdgeDeviceOptions__NodeUrl=${NODE_URL:?"The Tributech Node Url is required"}
    networks:
      ads-net:
        ipv4_address: 172.24.1.7
    ports:
      - "5001:8080" # enable access to agent REST-API (e.g. for configuration with Agent-Companion)
    volumes:
      - ./volumes:/app/data # volume mapping for permanent storage of keys and datatwin file
      - ./enrollment:/app/enrollment # local enrollment folder mounted to /app/enrollment
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "5"

  mosquitto-server:
    image: eclipse-mosquitto:${MQTT_TAG:-1.6}
    restart: unless-stopped
    networks:
      ads-net:
         ipv4_address: 172.24.1.3

networks:
  ads-net:
    ipam:
      config:
        - subnet: 172.24.1.0/24
